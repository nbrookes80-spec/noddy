name: Windows build

on:
  push:
    branches: [main]
    paths: ['General Motors/Linux-Tuning-Suite/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['General Motors/Linux-Tuning-Suite/**', '.github/workflows/windows.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: General Motors/Linux-Tuning-Suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r app/requirements.txt pyinstaller
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd app && python -m unittest discover -s tests -t .
      - name: Version
        id: ver
        run: echo "v=$(python -c "import re;print(re.search(r'__version__\s*=\s*.([0-9.]+)', open('app/tunertoolpro/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Build program
        run: >
          pyinstaller --noconfirm --windowed --name TunerToolPro
          --icon packaging/windows/TunerToolPro.ico
          --paths app --collect-submodules tunertoolpro
          --add-data "app/tunertoolpro/gui/assets;tunertoolpro/gui/assets" app/run_tunertoolpro.py
      - name: Smoke test (starts, then is stopped after 8 seconds)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/TunerToolPro/TunerToolPro.exe &
          pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "still running after 8 s: OK"; else wait "$pid"; echo "exited early with $?"; exit 1; fi
      - name: Installer
        env:
          MSYS_NO_PATHCONV: "1"   # keep Git Bash from turning /D... into a file path
        run: iscc /DAppVersion=${{ steps.ver.outputs.v }} packaging/windows/TunerToolPro.iss
      - uses: actions/upload-artifact@v4
        with:
          name: TunerToolPro-windows-installer
          path: General Motors/Linux-Tuning-Suite/dist-installer/*.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-installer/*.exe --clobber
